x-backend-image: &backend-image
  build:
    context: .
    dockerfile: Dockerfile
  image: inkar_opt_backend:latest

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-prod}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Qyzylorda}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for production}
  PHCENTER_TOKEN: ${PHCENTER_TOKEN:-}
  PHCENTER_BASE_URL: ${PHCENTER_BASE_URL:-https://ph.center}
  PROVISOR_BASE_URL: ${PROVISOR_BASE_URL:-https://api.provisor.kz}
  PROVISOR_LOGIN: ${PROVISOR_LOGIN:-}
  PROVISOR_PASSWORD: ${PROVISOR_PASSWORD:-}
  PROVISOR_EXCLUDED_FILIAL_IDS: ${PROVISOR_EXCLUDED_FILIAL_IDS:-1052,1076,1106,1107,1108,1111,1114,1149,1049}
  PROVISOR_AUTO_REFRESH_ENABLED: ${PROVISOR_AUTO_REFRESH_ENABLED:-false}
  PROVISOR_AUTO_REFRESH_CRON: "${PROVISOR_AUTO_REFRESH_CRON:-0 2 * * *}"
  PROVISOR_AUTO_REFRESH_MODE: ${PROVISOR_AUTO_REFRESH_MODE:-selected}
  PROVISOR_AUTO_REFRESH_MAX_PARALLEL_ACCOUNTS: ${PROVISOR_AUTO_REFRESH_MAX_PARALLEL_ACCOUNTS:-2}
  PROVISOR_AUTO_REFRESH_MAX_PARALLEL_PLK: ${PROVISOR_AUTO_REFRESH_MAX_PARALLEL_PLK:-1}
  PROVISOR_AUTO_REFRESH_KEEP_LAST_SUCCESS: ${PROVISOR_AUTO_REFRESH_KEEP_LAST_SUCCESS:-true}
  PROVISOR_AUTO_REFRESH_TIMEZONE: ${PROVISOR_AUTO_REFRESH_TIMEZONE:-Asia/Qyzylorda}
  EMIT_WORKER_ENABLED: ${EMIT_WORKER_ENABLED:-false}
  EMIT_CRON: "${EMIT_CRON:-0 3 * * *}"
  EMIT_TIMEZONE: ${EMIT_TIMEZONE:-Asia/Qyzylorda}
  EMIT_FILIAL_IDS: ${EMIT_FILIAL_IDS:-1106,1107,1108,1111,1114,1149,8371}
  EMIT_REFRESH_STALE_TIMEOUT_SECONDS: ${EMIT_REFRESH_STALE_TIMEOUT_SECONDS:-14400}
  EMIT_DOWNLOAD_TIMEOUT_SECONDS: ${EMIT_DOWNLOAD_TIMEOUT_SECONDS:-7200}
  EMIT_TEMP_DIR: ${EMIT_TEMP_DIR:-/tmp/emit}
  EMIT_DELETE_TEMP_AFTER_SUCCESS: ${EMIT_DELETE_TEMP_AFTER_SUCCESS:-true}
  EMIT_CLEANUP_TEMP_HOURS: ${EMIT_CLEANUP_TEMP_HOURS:-24}
  EMIT_MIN_FREE_DISK_GB: ${EMIT_MIN_FREE_DISK_GB:-15}
  EMIT_MAX_CONCURRENT_FILIALS: ${EMIT_MAX_CONCURRENT_FILIALS:-1}
  EMIT_MIN_FINAL_ROWS: ${EMIT_MIN_FINAL_ROWS:-100}
  EMIT_MIN_ROW_RATIO: ${EMIT_MIN_ROW_RATIO:-0.5}
  PARSER_WORKER_POLL_INTERVAL_SECONDS: ${PARSER_WORKER_POLL_INTERVAL_SECONDS:-5}
  PARSER_WORKER_CONCURRENCY: ${PARSER_WORKER_CONCURRENCY:-1}
  PARSER_WORKER_STALE_HEARTBEAT_SECONDS: ${PARSER_WORKER_STALE_HEARTBEAT_SECONDS:-180}
  PARSER_DAILY_SCHEDULE_ENABLED: ${PARSER_DAILY_SCHEDULE_ENABLED:-false}
  PARSER_DAILY_SCHEDULE_CRON: "${PARSER_DAILY_SCHEDULE_CRON:-0 2 * * *}"
  PARSER_DAILY_CATCHUP_MAX_HOURS: ${PARSER_DAILY_CATCHUP_MAX_HOURS:-6}
  PARSER_DAILY_SCHEDULE_UNTIL_DATE: "${PARSER_DAILY_SCHEDULE_UNTIL_DATE:-}"
  PARSER_DAILY_BASELINE_WINDOW: ${PARSER_DAILY_BASELINE_WINDOW:-7}
  PARSER_DAILY_BASELINE_MIN_SAMPLES: ${PARSER_DAILY_BASELINE_MIN_SAMPLES:-3}
  PARSER_DAILY_BASELINE_RATIO: ${PARSER_DAILY_BASELINE_RATIO:-0.65}
  SAP_BALANCE_ENABLED: ${SAP_BALANCE_ENABLED:-false}
  SAP_BALANCE_SCHEDULE_ENABLED: ${SAP_BALANCE_SCHEDULE_ENABLED:-false}
  # Offline saved-payload publication is an independent, temporary admin gate.
  SAP_OFFLINE_IMPORT_ENABLED: ${SAP_OFFLINE_IMPORT_ENABLED:-false}
  SAP_BALANCE_TARGET_ENVIRONMENT: ${SAP_BALANCE_TARGET_ENVIRONMENT:-piq}
  SAP_BALANCE_ALLOW_PIQ_REQUESTS: ${SAP_BALANCE_ALLOW_PIQ_REQUESTS:-false}
  SAP_BALANCE_BASE_URL: ${SAP_BALANCE_BASE_URL:-https://sap-piq.inkar.kz:53443/RESTAdapter/getBalance}
  SAP_BALANCE_USERNAME: ${SAP_BALANCE_USERNAME:-}
  SAP_BALANCE_PASSWORD: ${SAP_BALANCE_PASSWORD:-}
  SAP_BALANCE_COMPANY_CODE: ${SAP_BALANCE_COMPANY_CODE:-}
  SAP_BALANCE_CRON: "${SAP_BALANCE_CRON:-0 4 * * *}"
  SAP_BALANCE_TIMEOUT_SECONDS: ${SAP_BALANCE_TIMEOUT_SECONDS:-240}
  SAP_BALANCE_BRANCH_MAP_JSON: '${SAP_BALANCE_BRANCH_MAP_JSON:-{}}'
  SAP_MANUAL_PRECEDENCE_HOURS: ${SAP_MANUAL_PRECEDENCE_HOURS:-24}
  # Matching cache remains inert until each gate is explicitly enabled.
  MATCH_CACHE_ENABLED: ${MATCH_CACHE_ENABLED:-false}
  MATCH_CACHE_DUAL_WRITE: ${MATCH_CACHE_DUAL_WRITE:-false}
  MATCH_CACHE_READ: ${MATCH_CACHE_READ:-false}
  MATCH_CACHE_READ_MODE: ${MATCH_CACHE_READ_MODE:-fallback}
  MATCH_CACHE_READ_PRICE_FORMAT_IDS: ${MATCH_CACHE_READ_PRICE_FORMAT_IDS:-}
  MATCH_CACHE_READ_ALLOW_ALL: ${MATCH_CACHE_READ_ALLOW_ALL:-false}
  MATCH_CACHE_WORKER_ENABLED: ${MATCH_CACHE_WORKER_ENABLED:-false}
  MATCH_CACHE_WORKER_POLL_INTERVAL_SECONDS: ${MATCH_CACHE_WORKER_POLL_INTERVAL_SECONDS:-5}
  MATCH_CACHE_WORKER_LEASE_SECONDS: ${MATCH_CACHE_WORKER_LEASE_SECONDS:-900}
  MATCH_CACHE_SHADOW_ENABLED: ${MATCH_CACHE_SHADOW_ENABLED:-false}
  MATCH_CACHE_SOURCE_NOOP_ENABLED: ${MATCH_CACHE_SOURCE_NOOP_ENABLED:-false}
  # If frontend/backend are not on one origin, set the needed origin here.
  # CORS_ALLOW_ORIGINS: "http://10.10.1.77:8010"

services:
  db:
    image: postgres:16-alpine
    container_name: inkar_opt_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inkar_opt}
      POSTGRES_USER: ${POSTGRES_USER:-inkar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inkar} -d ${POSTGRES_DB:-inkar_opt}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    <<: *backend-image
    container_name: inkar_opt_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *backend-env
      PROCESS_ROLE: web
      PORT: 8000
      FRONTEND_DIST: /app/front/dist
    command: ["sh", "-c", "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${APP_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    <<: *backend-image
    container_name: inkar_opt_worker
    restart: unless-stopped
    # Server 77 points DATABASE_URL at the authoritative PostgreSQL on server 75.
    # Keep this service independent of the local `db` service so it never starts
    # a competing database as an implicit dependency.
    environment:
      <<: *backend-env
      PROCESS_ROLE: worker
    command: ["python", "-m", "app.worker"]
    volumes:
      - emit_tmp:/tmp/emit

  app:
    <<: *backend-image
    container_name: inkar_opt_app
    profiles: ["rollback"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *backend-env
      PROCESS_ROLE: all
      PORT: 8000
      FRONTEND_DIST: /app/front/dist
    command: ["sh", "-c", "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${APP_PORT:-8010}:8000"

volumes:
  pgdata:
  emit_tmp:
